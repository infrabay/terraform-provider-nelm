# Dependency update automation. Every PR Dependabot opens runs the full CI
# gauntlet — unit tests, golangci-lint, AND the live kind acceptance suite —
# so a green bump PR has actually exercised the provider against a real
# cluster.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The k8s.io modules are transitively pinned by github.com/werf/nelm
      # and must move in LOCKSTEP with it (and each other): bumping one alone
      # pulls structured-merge-diff/v6 against a client-go still on v4 and
      # the build fails. They get updated together with a nelm bump, never
      # standalone.
      - dependency-name: "k8s.io/*"
      - dependency-name: "sigs.k8s.io/*"
      # github.com/werf/nelm follows its own trdl STABILITY CHANNELS
      # (trdl_channels.yml in the nelm repo: alpha/beta/ea/stable/rock-solid).
      # The Go module proxy's "latest" is typically the ALPHA channel, which
      # Dependabot cannot know — this provider pins the version the *stable*
      # channel points to, and nelm bumps are made manually (or by a channel
      # watcher), reviewed against docs/KNOWN_LIMITATIONS.md.
      - dependency-name: "github.com/werf/nelm"
    groups:
      # Routine minor/patch bumps arrive as one grouped PR to keep noise low.
      go-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns:
          # github.com/werf/nelm is NOT a routine dependency: the provider
          # wraps its internal plan/dry-run/redaction behavior, so a nelm
          # bump is a semantic change that must land as its own PR and get a
          # real review against docs/KNOWN_LIMITATIONS.md — never grouped,
          # never auto-merged.
          - "github.com/werf/nelm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
