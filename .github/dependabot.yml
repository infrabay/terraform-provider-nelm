# Dependency update automation. Every PR Dependabot opens runs the full CI
# gauntlet — unit tests, golangci-lint, AND the live kind acceptance suite —
# so a green bump PR has actually exercised the provider against a real
# cluster.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Routine minor/patch bumps arrive as one grouped PR to keep noise low.
      go-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns:
          # github.com/werf/nelm is NOT a routine dependency: the provider
          # wraps its internal plan/dry-run/redaction behavior, so a nelm
          # bump is a semantic change that must land as its own PR and get a
          # real review against docs/KNOWN_LIMITATIONS.md — never grouped,
          # never auto-merged.
          - "github.com/werf/nelm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
