name: release

# Publishes a Terraform-Registry-ready release when a semantic-version tag is
# pushed. Prerequisites (repository secrets):
#   GPG_PRIVATE_KEY - ASCII-armored private key whose PUBLIC half is registered
#                     with the Terraform Registry publisher (Settings -> Signing
#                     Keys). This is what signs the SHA256SUMS.
#   PASSPHRASE      - passphrase for that GPG key.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
