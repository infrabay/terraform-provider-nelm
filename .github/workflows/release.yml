name: release

# Publishes a Terraform-Registry-ready release when a semantic-version tag is
# pushed: the test workflow runs against the tagged commit first, then
# GoReleaser builds and signs the release. Secrets:
#   GPG_PRIVATE_KEY - ASCII-armored private key whose PUBLIC half is registered
#                     with the Terraform Registry publisher (Settings -> Signing
#                     Keys). This is what signs the SHA256SUMS.
#   PASSPHRASE      - passphrase for that GPG key.
# Keep them in a 'release' environment (deployment tags v*, required
# reviewers) and uncomment `environment: release` below, so that only a
# protected tag push can read them.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser reads the previous tag and the commit history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # The newest v2 release; a major goreleaser upgrade needs a commit.
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
