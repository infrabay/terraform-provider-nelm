apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-basic
  labels:
    {{- include "basic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "basic.labels" . | nindent 4 }}
