apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-basic
  labels:
    {{- include "basic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "basic.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "basic.labels" . | nindent 8 }}
    spec:
      containers:
        - name: basic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-basic
          env:
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-basic
                  key: password
