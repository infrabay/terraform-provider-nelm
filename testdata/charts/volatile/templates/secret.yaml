{{- /*
The bitnami/grafana pattern: reuse the password once the Secret exists,
generate one otherwise. lookup finds nothing until the first install has
created the Secret, so every render of a first install generates a new one.
*/}}
{{- $name := printf "%s-volatile" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "volatile.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
